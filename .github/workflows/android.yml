name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests: only the latest push matters. Branches: let a running build (and its release)
  # finish; the newest push waits for it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (protocols against embedded FTP/SFTP/WebDAV servers, app logic)
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest

      - name: Build the APKs
        env:
          SCRIGNO_KEYSTORE_BASE64: ${{ secrets.SCRIGNO_KEYSTORE_BASE64 }}
          SCRIGNO_KEYSTORE_PASSWORD: ${{ secrets.SCRIGNO_KEYSTORE_PASSWORD }}
          SCRIGNO_KEY_ALIAS: ${{ secrets.SCRIGNO_KEY_ALIAS }}
          SCRIGNO_KEY_PASSWORD: ${{ secrets.SCRIGNO_KEY_PASSWORD }}
        run: |
          if [ -n "$SCRIGNO_KEYSTORE_BASE64" ]; then
            echo "$SCRIGNO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export SCRIGNO_KEYSTORE="$RUNNER_TEMP/release.keystore"
            echo "Signing the release with your key."
          else
            echo "::notice::No SCRIGNO_KEYSTORE_BASE64 secret: the release APK is signed with the public development key."
          fi
          ./gradlew --stacktrace :app:assembleRelease :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Scrigno.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Scrigno-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Scrigno-apk
          path: dist/
          if-no-files-found: error

      - name: Publish the "nightly" release (latest build of the default branch)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/Scrigno.apk dist/Scrigno-debug.apk dist/SHA256SUMS.txt \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Scrigno – latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Install **Scrigno.apk** (see the README for instructions, also from Termux)."

      - name: Publish the versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Scrigno.apk dist/SHA256SUMS.txt \
            --title "Scrigno $GITHUB_REF_NAME" \
            --generate-notes

  servers:
    name: Protocols against real servers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Start OpenSSH, vsftpd, Samba and Apache WebDAV
        run: scripts/ci/start-test-servers.sh

      - name: SFTP, FTP, FTPS, SMB, WebDAV, WebDAVS contract tests
        run: scripts/ci/run-server-tests.sh

  emulator:
    name: App on an Android emulator (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Start OpenSSH, vsftpd, Samba and Apache WebDAV (reached by the emulator at 10.0.2.2)
        run: scripts/ci/start-test-servers.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the test APK
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Backup, free up space, restore and first-launch UI tests on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.scrignoServers=$(scripts/ci/emulator-servers.sh)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore

      - name: Publish the screenshots taken on the emulator
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t shots < <(find app/build/outputs/connected_android_test_additional_output -name '*.png' | sort)
          if [ "${#shots[@]}" -eq 0 ]; then echo "No screenshots"; exit 0; fi
          gh release delete screenshots --yes --cleanup-tag || true
          gh release create screenshots "${shots[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Screenshots" \
            --notes "Screens of the app taken on an Android 14 emulator by the tests (build ${GITHUB_SHA::7})."
